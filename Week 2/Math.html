<html>
    <head>
        <title>Calculate with Same Function</title>
    </head>

    <body>

        <h1>Math Calculator</h1>

        <p>This is a simple math calculator.</p>

        <input type="number" id="Num1" placeholder="Enter first number">

        <input type="number" id="Num2" placeholder="Enter second number">

        <br><br>

        <button onclick="calc('Add')" id="add">Add</button>

        <button onclick="calc('Subtract')" id="subtract">Subtract</button>

        <button onclick="calc('Multiply')" id="multiply">Multiply</button>

        <button onclick="calc('Divide')" id="divide">Divide</button>

        <p id="calculate"></p>

        <script src="Math.js"></script>

    </body>
</html>
